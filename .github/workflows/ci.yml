name: Validacao do sistema bancario
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressao-e-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Backend, BDD e cobertura
        run: sh mvnw -B -ntp clean verify dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath.txt -Dmdep.includeScope=test
      - name: Instalar Cypress com versoes fixas
        run: |
          npm ci --prefix e2e --ignore-scripts
          node e2e/node_modules/cypress/bin/cypress install
      - name: Fluxo real no navegador
        run: xvfb-run -a npm --prefix e2e test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-e-cobertura
          path: |
            backend/target/surefire-reports/
            backend/target/cucumber/
            backend/target/site/jacoco/
            e2e/results/
            e2e/screenshots/
  mutacao:
    needs: regressao-e-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PIT do dominio e servicos
        run: sh mvnw -B -ntp -f backend/pom.xml test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutacao
          path: backend/target/pit-reports/
